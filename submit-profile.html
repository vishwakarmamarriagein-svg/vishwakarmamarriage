<!DOCTYPE html>
<html>
<head>

<title>Submit Profile - Vishwakarma Matrimony</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial, sans-serif;
margin:0;
padding:20px;
background:#f5f5f5;
}

form{
max-width:500px;
width:95%;
margin:auto;
display:flex;
flex-direction:column;
gap:10px;
}

input,select{
width:100%;
padding:10px;
font-size:16px;
box-sizing:border-box;
}

button{
background:maroon;
color:white;
padding:12px;
border:none;
cursor:pointer;
font-size:16px;
}

button:disabled{
background:#999;
cursor:not-allowed;
}

.upload-btn{
display:block;
background:#8b0000;
color:white;
padding:10px;
border-radius:4px;
cursor:pointer;
text-align:center;
font-size:15px;
}

.upload-btn:hover{
background:#a00000;
}

#message{
text-align:center;
margin-top:20px;
display:none;
}

</style>

</head>

<body>

<h2 style="text-align:center;">Submit Your Profile</h2>

<form id="profileForm">

<label>Full Name</label>
<input type="text" id="name" required>

<label>Date of Birth</label>
<input type="date" id="dob" required>

<label>Age</label>
<input type="number" id="age" readonly>

<select id="type" required>
<option value="">Select Type</option>
<option value="bride">Bride</option>
<option value="groom">Groom</option>
</select>

<select id="category" required>
<option value="">Select Category</option>
<option value="Manu">Manu</option>
<option value="May">May</option>
<option value="Tvasta">Tvasta</option>
<option value="Shilpi">Shilpi</option>
<option value="Daivagya">Daivagya</option>
</select>

<input type="text" id="City" placeholder="Enter Village/City" required>

<input type="text" id="district" placeholder="Enter District" required>

<select id="state" required>
<option value="">Select State</option>
<option value="Andhra Pradesh">Andhra Pradesh</option>
<option value="Assam">Assam</option>
<option value="Bihar">Bihar</option>
<option value="Chhattisgarh">Chhattisgarh</option>
<option value="Goa">Goa</option>
<option value="Gujarat">Gujarat</option>
<option value="Haryana">Haryana</option>
<option value="Karnataka">Karnataka</option>
<option value="Kerala">Kerala</option>
<option value="Madhya Pradesh">Madhya Pradesh</option>
<option value="Maharashtra">Maharashtra</option>
<option value="Punjab">Punjab</option>
<option value="Rajasthan">Rajasthan</option>
<option value="Tamil Nadu">Tamil Nadu</option>
<option value="Telangana">Telangana</option>
<option value="Uttar Pradesh">Uttar Pradesh</option>
<option value="West Bengal">West Bengal</option>
</select>

<label for="photo" class="upload-btn">Upload Photo</label>
<input type="file" id="photo" accept="image/*" required hidden>
<div id="fileName" style="font-size:14px;color:#666;"></div>

<input type="tel" id="contact" placeholder="Contact Number" maxlength="10" required>

<button id="submitBtn" type="submit">Submit Profile</button>

</form>

<p id="message"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, collection, addDoc } 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";

const firebaseConfig = {

apiKey: "AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
projectId: "vishwakarmamarriage-e8e13",
storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId: "287592386640",
appId: "1:287592386640:web:93a60b14daf415eac3c155"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);


// DOB → Age Auto Calculation
document.getElementById("dob").addEventListener("change", function(){

const dob = new Date(this.value);
const today = new Date();

let age = today.getFullYear() - dob.getFullYear();
const m = today.getMonth() - dob.getMonth();

if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
age--;
}

document.getElementById("age").value = age;

});


// Show selected photo name
document.getElementById("photo").addEventListener("change", function(){

const file = this.files[0];

if(file){
document.getElementById("fileName").textContent = file.name;
}

});


// Form submit
document.getElementById("profileForm").addEventListener("submit", async (e)=>{

e.preventDefault();

const submitBtn=document.getElementById("submitBtn");
submitBtn.disabled=true;
submitBtn.innerText="Submitting...";

try{

const name=document.getElementById("name").value;
const age=document.getElementById("age").value;
const type=document.getElementById("type").value;

if(type === "bride" && age < 18){
alert("Bride must be at least 18 years old as per Government of India law.");
submitBtn.disabled=false;
submitBtn.innerText="Submit Profile";
return;
}

if(type === "groom" && age < 21){
alert("Groom must be at least 21 years old as per Government of India law.");
submitBtn.disabled=false;
submitBtn.innerText="Submit Profile";
return;
}

const category=document.getElementById("category").value;
const city=document.getElementById("City").value;
const district=document.getElementById("district").value;
const state=document.getElementById("state").value;
const contact=document.getElementById("contact").value;
if(contact.length !== 10 || !/^[0-9]+$/.test(contact)){

alert("Please enter 10 digit mobile number");

submitBtn.disabled=false;
submitBtn.innerText="Submit Profile";

return;

}
const profileID = "VM" + Date.now();

const file=document.getElementById("photo").files[0];
let photoURL="";

if(file){

const storageRef=ref(storage,"profiles/"+Date.now()+"_"+file.name);

await uploadBytes(storageRef,file);

photoURL=await getDownloadURL(storageRef);

}

const profileData={
profileID: profileID,
name:name,
age:age,
type:type,
category:category,
city:city,
district:district,
state:state,
photo:photoURL,
contact:contact,
status:"pending",
createdAt:new Date()
};

await addDoc(collection(db,"pendingProfiles"),profileData);

const messageBox=document.getElementById("message");

messageBox.style.display="block";

messageBox.innerHTML=`
<div style="background:#e8f5e9;border:1px solid #4CAF50;padding:20px;border-radius:6px;max-width:450px;margin:auto;">

<b style="color:#2e7d32;font-size:18px;">Profile Submitted Successfully!</b>

<br><br>

Your Profile ID: <b>${profileID}</b>

<br><br>

Contact Admin for Approval.

<br><br>

<button id="whatsappBtn" style="background:#25D366;color:white;padding:10px 15px;border:none;border-radius:5px;font-weight:bold;cursor:pointer;">
Click Here to Chat
</button>

</div>
`;

messageBox.scrollIntoView({behavior:"smooth"});

document.getElementById("profileForm").reset();
submitBtn.innerText="Submitted";

const whatsappMessage=
`Hello Admin,
New profile submitted on Vishwakarma Matrimony

Profile ID: ${profileID}
Name: ${name}
Age: ${age}
Category: ${category}
City: ${city}
Contact: ${contact}

Please review and approve.`;

document.getElementById("whatsappBtn").onclick=function(){

const encodedMessage=encodeURIComponent(whatsappMessage);

window.open(`https://wa.me/917990589183?text=${encodedMessage}`,"_blank");

};

}

catch(error){

document.getElementById("message").style.display="block";
document.getElementById("message").innerText="Error submitting profile. Please try again.";

submitBtn.disabled=false;
submitBtn.innerText="Submit Profile";

console.error(error);

}

});

</script>

</body>
</html>
