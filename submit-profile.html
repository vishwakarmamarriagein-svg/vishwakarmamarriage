<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";


const firebaseConfig = {
apiKey: "AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
projectId: "vishwakarmamarriage-e8e13",
storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId: "287592386640",
appId: "1:287592386640:web:93a60b14daf415eac3c155"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
// Wait until faceapi is loaded
async function loadFaceAPI(){
  while(typeof faceapi === "undefined"){
    await new Promise(res => setTimeout(res, 100));
  }
  await faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
}

await loadFaceAPI();


document.getElementById("dob").addEventListener("change",function(){

const dob=new Date(this.value);
const today=new Date();

let age=today.getFullYear()-dob.getFullYear();

if(today < new Date(today.getFullYear(),dob.getMonth(),dob.getDate())) age--;

document.getElementById("age").value=age;

});

document.getElementById("photo").addEventListener("change", async function(e){
const file = e.target.files[0];
if(!file) return;

/* SIZE CHECK */
if(file.size > 2 * 1024 * 1024){
alert("Image size should be less than 2MB");
e.target.value = "";
return;
}

document.getElementById("fileName").textContent = file.name;

const preview = document.getElementById("preview");
preview.src = URL.createObjectURL(file);
preview.style.display = "block";

const img = new Image();
img.src = URL.createObjectURL(file);

img.onload = async function(){

const width = img.width;
const height = img.height;

/* BASIC FILTERS */
if(width > height){
alert("Upload portrait image only");
resetImage();
return;
}

if(width < 400 || height < 600){
alert("Image too small. Upload clear photo.");
resetImage();
return;
}

if(height / width < 1.4){
alert("Upload proper portrait photo");
resetImage();
return;
}

/* 🧠 FACE DETECTION */
let detections = [];
try{
  detections = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions());
}catch(err){
  alert("Face detection failed. Please try another image.");
  resetImage();
  return;
}

if(detections.length === 0){
alert("No face detected. Upload clear face photo.");
resetImage();
return;
}

if(detections.length > 1){
alert("Multiple faces detected. Upload single person photo.");
resetImage();
return;
}

};

function resetImage(){
e.target.value = "";
document.getElementById("fileName").textContent = "";
document.getElementById("preview").style.display = "none";
}

});


document.getElementById("job").addEventListener("change",function(){

document.getElementById("jobDetails").style.display=
this.value==="Working"?"block":"none";

});

// Manglik show/hide

document.getElementById("manglik").addEventListener("change", function(){

const box = document.getElementById("manglikTypeBox");

if(this.value === "Yes"){
box.style.display = "block";
}else{
box.style.display = "none";
}

});

document.getElementById("profileForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const submitBtn=document.getElementById("submitBtn");

submitBtn.disabled=true;
submitBtn.innerText="Submitting...";

try{

const name=document.getElementById("name").value;
const dob=document.getElementById("dob").value;
const age=document.getElementById("age").value;
const type=document.getElementById("type").value;

if(type==="bride" && age<18){
alert("Bride must be at least 18 years old.");
return;
}

if(type==="groom" && age<21){
alert("Groom must be at least 21 years old.");
return;
}

const height=document.getElementById("heightFeet").value+"'"+document.getElementById("heightInch").value+'"';

const profileID="VM"+Date.now();

const file=document.getElementById("photo").files[0];

let photoURL="";

if(file){

const storageRef=ref(storage,"profiles/"+Date.now()+"_"+file.name);

await uploadBytes(storageRef,file);

photoURL=await getDownloadURL(storageRef);

}


await addDoc(collection(db,"pendingProfiles"),{

profileID,
name,
dob,
age,
height,
weight:document.getElementById("weight").value,
manglik:document.getElementById("manglik").value,
manglikType:document.getElementById("manglikType").value,
maritalStatus:document.getElementById("maritalStatus").value,
qualification:document.getElementById("qualification").value,
job:document.getElementById("job").value,
occupation:document.getElementById("occupation").value,
salary:document.getElementById("salary").value,
father:document.getElementById("father").value,
mother:document.getElementById("mother").value,
type:type,
category:document.getElementById("category").value,
city:document.getElementById("City").value,
district:document.getElementById("district").value,
state:document.getElementById("state").value,
contact:document.getElementById("contact").value,
photo:photoURL,
status:"pending",
createdAt:new Date()

});


document.getElementById("profileForm").style.display="none";

document.getElementById("message").style.display="block";

document.getElementById("message").innerHTML=

"<b style='color:green;font-size:18px;'>Profile Submitted Successfully</b><br><br>"+
"Your Profile ID: <b>"+profileID+"</b><br><br>"+
"<a class='whatsapp-btn' href='https://wa.me/919429805159?text=Hello Admin My Profile ID is "+profileID+"' target='_blank'>Contact Admin on WhatsApp</a>";

}catch(error){

alert("Error submitting profile");

submitBtn.disabled=false;

submitBtn.innerText="Submit Profile";

}

});

</script>
