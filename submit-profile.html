<!DOCTYPE html>
<html>
<head>
  <title>Submit Profile - Vishwakarma Matrimony</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 style="text-align:center;">Submit Your Profile</h2>

<form id="profileForm" style="max-width:500px;margin:auto;display:flex;flex-direction:column;gap:10px;">

  <input type="text" id="name" placeholder="Full Name" required>
  <input type="number" id="age" placeholder="Age" required>

  <select id="type" required>
    <option value="">Select Type</option>
    <option value="bride">Bride</option>
    <option value="groom">Groom</option>
  </select>
<select id="category">
  <option value="">Select Category</option>
  <option value="Manu">Manu</option>
  <option value="May">May</option>
  <option value="Tvasta">Tvasta</option>
  <option value="Shilpi">Shilpi</option>
  <option value="Daivagya">Daivagya</option>
</select>
  <input type="text" id="City" placeholder="Enter Village/City" required>
  <input type="text" id="district" placeholder="Enter District" required>
<select id="state" required>
<option value="">Select State</option>
<option value="Andhra Pradesh">Andhra Pradesh</option>
<option value="Arunachal Pradesh">Arunachal Pradesh</option>
<option value="Assam">Assam</option>
<option value="Bihar">Bihar</option>
<option value="Chhattisgarh">Chhattisgarh</option>
<option value="Goa">Goa</option>
<option value="Gujarat">Gujarat</option>
<option value="Haryana">Haryana</option>
<option value="Himachal Pradesh">Himachal Pradesh</option>
<option value="Jharkhand">Jharkhand</option>
<option value="Karnataka">Karnataka</option>
<option value="Kerala">Kerala</option>
<option value="Madhya Pradesh">Madhya Pradesh</option>
<option value="Maharashtra">Maharashtra</option>
<option value="Manipur">Manipur</option>
<option value="Meghalaya">Meghalaya</option>
<option value="Mizoram">Mizoram</option>
<option value="Nagaland">Nagaland</option>
<option value="Odisha">Odisha</option>
<option value="Punjab">Punjab</option>
<option value="Rajasthan">Rajasthan</option>
<option value="Sikkim">Sikkim</option>
<option value="Tamil Nadu">Tamil Nadu</option>
<option value="Telangana">Telangana</option>
<option value="Tripura">Tripura</option>
<option value="Uttar Pradesh">Uttar Pradesh</option>
<option value="Uttarakhand">Uttarakhand</option>
<option value="West Bengal">West Bengal</option>
<option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
<option value="Chandigarh">Chandigarh</option>
<option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
<option value="Delhi">Delhi</option>
<option value="Jammu and Kashmir">Jammu and Kashmir</option>
<option value="Ladakh">Ladakh</option>
<option value="Lakshadweep">Lakshadweep</option>
<option value="Puducherry">Puducherry</option>
</select>
<input type="file" id="photo" accept="image/*" required>
  <input type="text" id="contact" placeholder="Contact Number" required>

  <button type="submit" style="background:maroon;color:white;padding:10px;border:none;cursor:pointer;">
    Submit Profile
  </button>

</form>

<p id="message" style="text-align:center;margin-top:15px;"></p>

<script type="module">
  
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";
const firebaseConfig = {
  apiKey: "AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
  authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
  projectId: "vishwakarmamarriage-e8e13",
  storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
  messagingSenderId: "287592386640",
  appId: "1:287592386640:web:93a60b14daf415eac3c155"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
document.getElementById("profileForm").addEventListener("submit", async (e) => {

  e.preventDefault();

  const file = document.getElementById("photo").files[0];

let photoURL = "";

if (file) {

  const storageRef = ref(storage, "profiles/" + Date.now() + "_" + file.name);

  await uploadBytes(storageRef, file);

  photoURL = await getDownloadURL(storageRef);

}
  const profileData = {
  name: document.getElementById("name").value,
  age: document.getElementById("age").value,
  type: document.getElementById("type").value,
  category: document.getElementById("category").value,
  city: document.getElementById("City").value,
  district: document.getElementById("district").value,
  state: document.getElementById("state").value,
  photo: photoURL,
  contact: document.getElementById("contact").value,
  status: "pending",
  createdAt: new Date()
};

  try {
    console.log("Submitting profile:", profileData);
    await addDoc(collection(db, "pendingProfiles"), profileData);
    document.getElementById("message").innerHTML =
`
<div style="background:#e8f5e9;border:1px solid #4CAF50;padding:15px;border-radius:5px;max-width:450px;margin:auto;">
<b style="color:#2e7d32;">Profile Submitted Successfully!</b><br><br>
Contact Admin for Approval.<br><br>

<a href="https://wa.me/917990589183?text=Hello%20Admin,%20I%20have%20submitted%20my%20profile%20on%20Vishwakarma%20Matrimony.%20Please%20approve%20it."
target="_blank"
style="background:#25D366;color:white;padding:10px 15px;text-decoration:none;border-radius:5px;font-weight:bold;">
Chat with Admin on WhatsApp
</a>
</div>
`;
    document.getElementById("profileForm").reset();
  } catch (error) {
    document.getElementById("message").innerText = "Error submitting profile.";
    console.error(error);
  }

});
</script>
</body>
</html>
