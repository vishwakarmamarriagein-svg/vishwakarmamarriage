<!DOCTYPE html>
<html>
<head>

<title>Submit Profile - Vishwakarma Matrimony</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial, sans-serif;
margin:0;
padding:20px;
background:#f5f5f5;
}

form{
max-width:500px;
width:95%;
margin:auto;
display:flex;
flex-direction:column;
gap:10px;
}

input,select{
width:100%;
padding:10px;
font-size:16px;
box-sizing:border-box;
}

button{
background:maroon;
color:white;
padding:12px;
border:none;
cursor:pointer;
font-size:16px;
}

button:disabled{
background:#999;
cursor:not-allowed;
}

.upload-btn{
display:block;
background:#8b0000;
color:white;
padding:10px;
border-radius:4px;
cursor:pointer;
text-align:center;
font-size:15px;
}

.upload-btn:hover{
background:#a00000;
}

#message{
text-align:center;
margin-top:20px;
display:none;
}

.whatsapp-btn{
display:inline-block;
margin-top:15px;
background:#25D366;
color:white;
padding:10px 18px;
border-radius:6px;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<h2 style="text-align:center;">Submit Your Profile</h2>

<form id="profileForm">

<label>Full Name</label>
<input type="text" id="name" required>

<label>Date of Birth</label>
<input type="date" id="dob" required>

<label>Age</label>
<input type="number" id="age" readonly>

<label>Height</label>

<div style="display:flex; gap:10px;">

<select id="heightFeet" required>
<option value="">Feet</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
</select>

<select id="heightInch" required>
<option value="">Inch</option>
<option>0</option>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
<option>11</option>
</select>

</div>

<label>Weight (kg)</label>
<input type="number" id="weight" required>

<label>Manglik</label>
<select id="manglik" required>
<option value="">Select</option>
<option>Yes</option>
<option>No</option>
</select>

<label>Qualification</label>
<input type="text" id="qualification" required>

<label>Job Status</label>
<select id="job" required>
<option value="">Select</option>
<option>Working</option>
<option>Not Working</option>
</select>

<label>Father Name</label>
<input type="text" id="father" required>

<label>Mother Name</label>
<input type="text" id="mother" required>

<select id="type" required>
<option value="">Select Type</option>
<option value="bride">Bride</option>
<option value="groom">Groom</option>
</select>

<select id="category" required>
<option value="">Select Category</option>
<option value="Manu">Manu</option>
<option value="May">May</option>
<option value="Tvasta">Tvasta</option>
<option value="Shilpi">Shilpi</option>
<option value="Daivagya">Daivagya</option>
</select>

<input type="text" id="City" placeholder="Enter Village/City" required>

<input type="text" id="district" placeholder="Enter District" required>

<select id="state" required>
<option value="">Select State</option>
<option>Gujarat</option>
<option>Uttar Pradesh</option>
<option>Maharashtra</option>
<option>Rajasthan</option>
<option>Madhya Pradesh</option>
<option>Bihar</option>
<option>Punjab</option>
<option>Haryana</option>
<option>Tamil Nadu</option>
<option>Karnataka</option>
<option>West Bengal</option>
</select>

<label for="photo" class="upload-btn">Upload Photo</label>
<input type="file" id="photo" accept="image/*" required hidden>

<div id="fileName"></div>

<input type="tel" id="contact" placeholder="Contact Number" maxlength="10" required>

<button id="submitBtn" type="submit">Submit Profile</button>

</form>

<p id="message"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, collection, addDoc }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";

const firebaseConfig = {

apiKey: "AIzaSyAy...",
authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
projectId: "vishwakarmamarriage-e8e13",
storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId: "287592386640",
appId: "1:287592386640:web:93a60b14daf415eac3c155"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);


document.getElementById("dob").addEventListener("change", function(){

const dob = new Date(this.value);
const today = new Date();

let age = today.getFullYear() - dob.getFullYear();

const m = today.getMonth() - dob.getMonth();

if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;

document.getElementById("age").value = age;

});


document.getElementById("photo").addEventListener("change", function(){

const file = this.files[0];

if(file){
document.getElementById("fileName").textContent = file.name;
}

});


document.getElementById("profileForm").addEventListener("submit", async (e)=>{

e.preventDefault();

const submitBtn=document.getElementById("submitBtn");
submitBtn.disabled=true;
submitBtn.innerText="Submitting...";

try{

const name=document.getElementById("name").value;
const age=document.getElementById("age").value;
const type=document.getElementById("type").value;

if(type==="bride" && age<18){
alert("Bride must be at least 18 years old.");
return;
}

if(type==="groom" && age<21){
alert("Groom must be at least 21 years old.");
return;
}

const heightFeet=document.getElementById("heightFeet").value;
const heightInch=document.getElementById("heightInch").value;
const height=heightFeet + "'" + heightInch + '"';

const weight=document.getElementById("weight").value;
const manglik=document.getElementById("manglik").value;
const qualification=document.getElementById("qualification").value;
const job=document.getElementById("job").value;
const father=document.getElementById("father").value;
const mother=document.getElementById("mother").value;

const category=document.getElementById("category").value;
const city=document.getElementById("City").value;
const district=document.getElementById("district").value;
const state=document.getElementById("state").value;
const contact=document.getElementById("contact").value;

if(contact.length!==10){
alert("Please enter 10 digit mobile number");
return;
}

const profileID="VM"+Date.now();

const file=document.getElementById("photo").files[0];

let photoURL="";

if(file){

const storageRef=ref(storage,"profiles/"+Date.now()+"_"+file.name);

await uploadBytes(storageRef,file);

photoURL=await getDownloadURL(storageRef);

}

const profileData={

profileID,
name,
age,
height,
weight,
manglik,
qualification,
job,
father,
mother,
type,
category,
city,
district,
state,
contact,
photo:photoURL,
status:"pending",
createdAt:new Date()

};

await addDoc(collection(db,"pendingProfiles"),profileData);

document.getElementById("message").style.display="block";

document.getElementById("message").innerHTML=
"<b style='color:green;font-size:18px;'>Profile Submitted Successfully</b><br><br>"+
"Please contact admin on WhatsApp for profile approval.<br>"+
"<a class='whatsapp-btn' href='https://wa.me/919429805159?text=Hello%20Admin%20I%20have%20submitted%20my%20profile%20on%20Vishwakarma%20Matrimony' target='_blank'>Click here to WhatsApp</a>";

document.getElementById("profileForm").reset();

submitBtn.innerText="Submitted";

}catch(error){

alert("Error submitting profile");

submitBtn.disabled=false;
submitBtn.innerText="Submit Profile";

}

});

</script>

</body>
</html>
