<!DOCTYPE html>
<html>
<head>
<title>Register - Vishwakarma Marriage</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>

body{
font-family:Poppins, Arial;
margin:0;
background:#f5f5f5;
}

/* REGISTER SECTION */

.register-container{
max-width:400px;
margin:80px auto;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

.register-container h2{
margin-bottom:20px;
}

.register-container input{
width:100%;
padding:10px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:4px;
font-size:14px;
}

.register-btn{
background:#8b0000;
color:white;
border:none;
padding:10px;
width:100%;
font-size:16px;
cursor:pointer;
border-radius:4px;
}

.register-btn:hover{
background:#a50000;
}

.login-link{
margin-top:15px;
font-size:14px;
}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header">

<div class="logo-container">
<img src="icon.png" class="logo-icon">
<span class="logo-text">Vishwakarma Marriage</span>
</div>

<nav class="navbar">

<a href="index.html">Home</a>

<a href="groom.html">Groom</a>

<a href="bride.html">Bride</a>

<a href="register.html" class="register-free">
Register Your Profile
</a>

<a href="login.html" id="loginLink">
Login
</a>

<a href="#" id="logoutLink" style="display:none;">
Logout
</a>

</nav>

</header>

<!-- REGISTER FORM -->

<div class="register-container">

<h2>Create Account</h2>

<input type="email" id="email" placeholder="Email Address">

<input type="password" id="password" placeholder="Password">

<button id="registerBtn" class="register-btn">
Register
</button>

<p class="login-link">
Already have account? <a href="login.html">Login</a>
</p>

</div>

<!-- FIREBASE REGISTER -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import { 
getAuth,
createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";


const firebaseConfig = {
apiKey: "AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
projectId: "vishwakarmamarriage-e8e13",
storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId: "287592386640",
appId: "1:287592386640:web:93a60b14daf415eac3c155"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


/* REGISTER ACCOUNT */

document.getElementById("registerBtn").addEventListener("click", async () => {

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

if(email==="" || password===""){
alert("Please fill all fields");
return;
}

if(password.length < 6){
alert("Password must be at least 6 characters");
return;
}

try{

await createUserWithEmailAndPassword(auth, email, password);

alert("Account Created Successfully");

window.location.href="submit-profile.html";

}catch(error){

alert(error.message);

}

});


</script>

<!-- LOGIN / LOGOUT CONTROL -->

<script>

const loginLink=document.getElementById("loginLink");
const logoutLink=document.getElementById("logoutLink");

if(localStorage.getItem("userLoggedIn")==="true"){

loginLink.style.display="none";
logoutLink.style.display="inline";

}

logoutLink.addEventListener("click",function(){

localStorage.removeItem("userLoggedIn");

alert("Logged out successfully");

window.location.href="index.html";

});

</script>

</body>
</html>
