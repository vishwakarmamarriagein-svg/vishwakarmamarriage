<!DOCTYPE html>
<html>
<head>
    <title>Bride Profiles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h2>Bride Profiles</h2>
<input type="text" id="searchInput" placeholder="Search by Name, City, Education..." onkeyup="searchProfiles()" style="padding:8px; width:300px; margin-bottom:20px;">
    <div class="category-buttons">
  <button onclick="filterCategory('All')">All</button>
  <button onclick="filterCategory('Manu')">Manu</button>
  <button onclick="filterCategory('May')">May</button>
  <button onclick="filterCategory('Twasta')">Twasta</button>
  <button onclick="filterCategory('Shilpi')">Shilpi</button>
  <button onclick="filterCategory('Daiwaggya')">Daiwaggya</button>
</div>

<div id="profiles-container" data-type="bride"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, collection, getDocs } 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
  authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
  projectId: "vishwakarmamarriage-e8e13",
  storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
  messagingSenderId: "287592386640",
  appId: "1:287592386640:web:93a60b14daf415eac3c155"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("profiles-container");

async function loadProfiles() {
  container.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "profiles"));

  querySnapshot.forEach((docSnap) => {

    const profile = docSnap.data();

    if (profile.type !== "bride") return;

    const card = document.createElement("div");
    card.className = "profile-card";

    card.innerHTML = `
      <img src="${profile.photo}" class="profile-photo">
      <h3>${profile.name}</h3>
      <p><strong>Category:</strong> ${profile.category}</p>
      <p><strong>Age:</strong> ${profile.age}</p>
      <p><strong>Location:</strong> ${profile.district}, ${profile.state}</p>
    `;

    container.appendChild(card);
  });
}

loadProfiles();
</script>
</body>
</html>
