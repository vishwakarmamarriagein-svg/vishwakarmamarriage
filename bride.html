<!DOCTYPE html>
<html>
<head>
<title>Bride Profiles</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page-container">

<h2>Bride Profiles</h2>

<div class="top-bar">

<input type="text" id="searchInput" placeholder="Search by Name, District or State">

<div class="filters">
<button onclick="filterCategory(event,'All')" class="active">All</button>
<button onclick="filterCategory(event,'Manu')">Manu</button>
<button onclick="filterCategory(event,'May')">May</button>
<button onclick="filterCategory(event,'Tvasta')">Tvasta</button>
<button onclick="filterCategory(event,'Shilpi')">Shilpi</button>
<button onclick="filterCategory(event,'Daivagya')">Daivagya</button>
</div>

</div>

<div id="profiles-container"></div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
projectId: "vishwakarmamarriage-e8e13",
storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId: "287592386640",
appId: "1:287592386640:web:93a60b14daf415eac3c155"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("profiles-container");
const searchInput = document.getElementById("searchInput");

let searchText = "";
let selectedCategory = "All";

async function loadProfiles(){

container.innerHTML="";

const querySnapshot = await getDocs(collection(db,"profiles"));

querySnapshot.forEach((docSnap)=>{

const profile = docSnap.data();

if(!profile.type || profile.type.toLowerCase() !== "bride") return;

if(selectedCategory !== "All" && profile.category !== selectedCategory) return;

const text = searchText.toLowerCase();

const name = (profile.name || "").toLowerCase();
const district = (profile.district || "").toLowerCase();
const state = (profile.state || "").toLowerCase();

if(name.indexOf(text) === -1 && district.indexOf(text) === -1 && state.indexOf(text) === -1) return;

const card = document.createElement("div");
card.className = "profile-card";

card.innerHTML = `

<img src="${profile.photo}" class="profile-photo">

<h3>${profile.name}</h3>

<p class="category-badge">${profile.category}</p>

<p>👤 Age: ${profile.age}</p>

<p>📍 ${profile.district}, ${profile.state}</p>

<a href="profile.html?id=${docSnap.id}">
<button class="view-btn">View Full Profile</button>
</a>

`;

container.appendChild(card);

});

}

loadProfiles();

searchInput.addEventListener("input",function(){
searchText=this.value;
loadProfiles();
});

window.filterCategory=function(event,category){

selectedCategory=category;

document.querySelectorAll(".filters button").forEach(btn=>{
btn.classList.remove("active");
});

event.target.classList.add("active");

loadProfiles();

};

</script>

</body>
</html>
