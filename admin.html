<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard - Vishwakarma Matrimony</title>

<style>

body{
font-family:Arial;
padding:30px;
background:#f4f4f4;
}

.box{
background:white;
padding:20px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

button{
padding:8px 12px;
border:none;
cursor:pointer;
color:white;
}

.approve{
background:green;
}

.reject{
background:red;
}

.logout{
position:absolute;
top:20px;
right:20px;
background:maroon;
}

</style>

</head>

<body>

<button id="logoutBtn" class="logout">Logout</button>

<div class="box">

<h2>Admin Dashboard</h2>
<p>Welcome Admin 👋</p>

<hr>
<hr>

<h3>Pending Profiles</h3>

<div id="profilesContainer"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import { 
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
getDoc,
addDoc,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
projectId: "vishwakarmamarriage-e8e13",
storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId: "287592386640",
appId: "1:287592386640:web:93a60b14daf415eac3c155"

};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);



onAuthStateChanged(auth,(user)=>{

if(!user){
window.location.href="login.html";
return;
}

const adminEmail="vishwakarmamarriage.in@gmail.com";

if(user.email.toLowerCase()!==adminEmail.toLowerCase()){

alert("Access Denied");

signOut(auth);

window.location.href="login.html";

return;

}

loadPendingProfiles();

});



async function loadPendingProfiles(){

const container=document.getElementById("profilesContainer");

container.innerHTML="";

const querySnapshot=await getDocs(collection(db,"pendingProfiles"));

querySnapshot.forEach((docSnap)=>{

const data=docSnap.data();

const docId=docSnap.id;

const div=document.createElement("div");

div.style.border="1px solid #ccc";
div.style.padding="10px";
div.style.marginBottom="10px";


div.innerHTML=`

<img src="${data.photo || 'images/default.jpg'}" width="100"><br>

<strong>${data.name}</strong><br>

Age: ${data.age}<br>

Type: ${data.type}<br>

Category: ${data.category}<br>

Location: ${data.district}, ${data.state}<br><br>

<button class="approve" onclick="approveProfile('${docId}')">Approve</button>

<button class="reject" onclick="rejectProfile('${docId}')">Reject</button>

`;

container.appendChild(div);

});

}



window.approveProfile=async function(docId){

const docRef=doc(db,"pendingProfiles",docId);

const docSnap=await getDoc(docRef);

if(docSnap.exists()){

const profileData=docSnap.data();

await addDoc(collection(db,"profiles"),profileData);

await deleteDoc(docRef);

alert("Profile Approved Successfully");

loadPendingProfiles();

}

}



window.rejectProfile=async function(docId){

if(!confirm("Reject this profile?")) return;

const docRef=doc(db,"pendingProfiles",docId);

await deleteDoc(docRef);

alert("Profile Rejected");

loadPendingProfiles();

}

document.getElementById("logoutBtn").addEventListener("click",async()=>{

await signOut(auth);

window.location.href="login.html";

});

</script>

</body>
</html>
