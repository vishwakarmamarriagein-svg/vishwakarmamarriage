<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - Vishwakarma Matrimony</title>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
            background-color: #f4f4f4;
        }
        .box {
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        button {
            padding: 10px;
            background: maroon;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: darkred;
        }
    </style>
</head>
<body>
<button id="logoutBtn" style="
  position: absolute;
  top: 20px;
  right: 20px;
  padding: 8px 15px;
  background: maroon;
  color: white;
  border: none;
  cursor: pointer;
">
  Logout
</button>
<div class="box">
    <h2>Admin Dashboard</h2>
    <p>Welcome Admin 👋</p>
    <hr>
    <hr>
<h3>Add New Profile</h3>

<div style="margin-bottom:20px;">

<input type="text" id="newName" placeholder="Name" style="padding:6px;margin:5px;">
<input type="number" id="newAge" placeholder="Age" style="padding:6px;margin:5px;">

<select id="newType" style="padding:6px;margin:5px;">
  <option value="bride">Bride</option>
  <option value="groom">Groom</option>
</select>

<input type="text" id="newCategory" placeholder="Category" style="padding:6px;margin:5px;">
<input type="text" id="newDistrict" placeholder="District" style="padding:6px;margin:5px;">
<input type="text" id="newState" placeholder="State" style="padding:6px;margin:5px;">
<input type="text" id="newPhoto" placeholder="Photo URL (images/xyz.jpg)" style="padding:6px;margin:5px;">
<button id="addProfileBtn" style="margin:5px;">Add Profile</button>
</div>
<hr>
<h3>Pending Profiles</h3>
<div id="profilesContainer"></div>   
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, collection, getDocs, getDoc, addDoc, deleteDoc, doc } 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
  authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
  projectId: "vishwakarmamarriage-e8e13",
  storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
  messagingSenderId: "287592386640",
  appId: "1:287592386640:web:93a60b14daf415eac3c155",
  measurementId: "G-ZRZV7KSB8Z"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
onAuthStateChanged(auth, (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const adminEmail = "vishwakarmamarriage.in@gmail.com";

  if (!user.email) {
    window.location.href = "login.html";
    return;
  }

  if (user.email.toLowerCase() !== adminEmail.toLowerCase()) {
    alert("Access Denied");
    signOut(auth);
    window.location.href = "login.html";
    return;
  }

  // ✅ Only admin reaches here
  loadPendingProfiles();
});
    

async function loadPendingProfiles() {

  const container = document.getElementById("profilesContainer");
  container.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "pendingProfiles"));
console.log("Pending profiles:", querySnapshot.size);
  querySnapshot.forEach((docSnap) => {

    const data = docSnap.data();
    const docId = docSnap.id;

    const div = document.createElement("div");
    div.style.border = "1px solid #ccc";
    div.style.padding = "10px";
    div.style.marginBottom = "10px";

    div.innerHTML = `
     div.innerHTML = `
  <img src="${data.photo || 'images/default.jpg'}" width="100"><br>
  <strong>${data.name}</strong><br>
  Age: ${data.age}<br>
  Type: ${data.type}<br>
  Category: ${data.category}<br>
  Location: ${data.district}, ${data.state}<br><br>

     <button onclick="approveProfile('${docId}')"
style="background:green;color:white;padding:5px 10px;border:none;margin-right:5px;">
Approve
</button>

<button onclick="rejectProfile('${docId}')"
style="background:red;color:white;padding:5px 10px;border:none;">
Reject
</button>
    `;

    container.appendChild(div);
  });
}
   window.approveProfile = async function(docId) {

  const docRef = doc(db, "pendingProfiles", docId);
  const docSnap = await getDoc(docRef);

  if (docSnap.exists()) {

    const profileData = docSnap.data();

    await addDoc(collection(db, "profiles"), profileData);
    await deleteDoc(docRef);

    alert("Profile Approved Successfully");
    loadPendingProfiles();
  }

};
    document.getElementById("addProfileBtn").addEventListener("click", async function() {

  const newProfile = {
    type: document.getElementById("newType").value,
    category: document.getElementById("newCategory").value,
    name: document.getElementById("newName").value,
    age: document.getElementById("newAge").value,
    district: document.getElementById("newDistrict").value,
    state: document.getElementById("newState").value,
    photo: document.getElementById("newPhoto").value,
    status: "approved"
  };

  await addDoc(collection(db, "profiles"), newProfile);

  alert("Profile Added Successfully");
});
    document.getElementById("logoutBtn").addEventListener("click", async function() {
  await signOut(auth);
  window.location.href = "login.html";
});
   </script>
</body>
</html>
