<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard - Vishwakarma Matrimony</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;padding:30px;background:#f4f4f4;}
.box{background:white;padding:20px;box-shadow:0 0 10px rgba(0,0,0,0.2);}
button{padding:8px 12px;border:none;cursor:pointer;color:white;margin-right:5px;border-radius:4px;}
.approve{background:green;}
.reject{background:red;}
.delete{background:#555;}
.view{background:#007bff;}
.edit{background:#ff9800;}
.logout{position:absolute;top:20px;right:20px;background:maroon;}
.profileCard{border:1px solid #ccc;padding:10px;margin-bottom:10px;border-radius:5px;background:#fafafa;}
.profileCard img{border-radius:5px;margin-bottom:8px;}
</style>
</head>

<body>

<button id="logoutBtn" class="logout">Logout</button>

<div class="box">

<h2>Admin Dashboard</h2>
<p>Welcome Admin 👋</p>

<hr><hr>

<h3>Pending Profiles</h3>
<div id="profilesContainer"></div>

<hr>

<h3>Approved Profiles</h3>
<div id="approvedProfilesContainer"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import { 
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
getDoc,
setDoc,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
projectId: "vishwakarmamarriage-e8e13",
storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId: "287592386640",
appId: "1:287592386640:web:93a60b14daf415eac3c155"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* ADMIN AUTH CHECK */

onAuthStateChanged(auth,(user)=>{

if(!user){
window.location.href="admin-login.html";
return;
}

const adminEmails = [
"vishwakarmamarriage.in@gmail.com"
];

if(!adminEmails.includes(user.email)){
alert("Admin access only");
window.location.href="index.html";
return;
}

loadPendingProfiles();
loadApprovedProfiles();

});


/* LOAD PENDING PROFILES */

async function loadPendingProfiles(){

const container=document.getElementById("profilesContainer");
container.innerHTML="";

const querySnapshot=await getDocs(collection(db,"pendingProfiles"));

querySnapshot.forEach((docSnap)=>{

const data=docSnap.data();
const docId=docSnap.id;

const div=document.createElement("div");
div.className="profileCard";

div.innerHTML=`
<img src="${data.photo || 'icon.png'}" width="100"><br>

<strong>${data.name}</strong><br>

Age: ${data.age}<br>
Type: ${data.type}<br>
Category: ${data.category}<br>
Location: ${data.district}, ${data.state}<br>
Submitted On: ${data.createdAt ? data.createdAt.toDate().toLocaleDateString() : ''}<br>
Contact: 
<a href="https://wa.me/91${data.contact}" target="_blank" style="color:green;font-weight:bold;">
${data.contact}
</a><br><br>
<button class="view" onclick="viewProfile('${docId}')">View</button>
<button class="edit" onclick="editProfile('${docId}','pending')">Edit</button>
<button class="approve" onclick="approveProfile('${docId}')">Approve</button>
<button class="reject" onclick="rejectProfile('${docId}')">Reject</button>
<button class="delete" onclick="deleteProfile('${docId}')">Delete</button>
`;

container.appendChild(div);

});

}


/* LOAD APPROVED PROFILES */

async function loadApprovedProfiles(){

const container=document.getElementById("approvedProfilesContainer");
container.innerHTML="";

const querySnapshot=await getDocs(collection(db,"profiles"));

querySnapshot.forEach((docSnap)=>{

const data=docSnap.data();
const docId=docSnap.id;

const div=document.createElement("div");
div.className="profileCard";

div.innerHTML=`
<img src="${data.photo || 'icon.png'}" width="100"><br>

<strong>${data.name}</strong><br>

Age: ${data.age}<br>
Type: ${data.type}<br>
Category: ${data.category}<br>
Location: ${data.district}, ${data.state}<br>
Submitted On: ${data.createdAt ? data.createdAt.toDate().toLocaleDateString() : ''}<br>
Contact: 
<a href="https://wa.me/91${data.contact}" target="_blank" style="color:green;font-weight:bold;">
${data.contact}
</a><br><br>
<button class="view" onclick="viewProfile('${docId}')">View</button>
<button class="edit" onclick="editProfile('${docId}','approved')">Edit</button>
<button class="delete" onclick="deleteApprovedProfile('${docId}')">Delete</button>
`;

container.appendChild(div);

});

}


/* APPROVE PROFILE */

window.approveProfile = async function(docId){

const docRef = doc(db,"pendingProfiles",docId);
const snap = await getDoc(docRef);

if(snap.exists()){

await setDoc(doc(db,"profiles",docId),snap.data());
await deleteDoc(docRef);

alert("Profile Approved");

loadPendingProfiles();
loadApprovedProfiles();

}

};


/* REJECT */

window.rejectProfile = async function(docId){

await deleteDoc(doc(db,"pendingProfiles",docId));
loadPendingProfiles();

};


/* DELETE */

window.deleteProfile = async function(docId){

await deleteDoc(doc(db,"pendingProfiles",docId));
loadPendingProfiles();

};

window.deleteApprovedProfile = async function(docId){

await deleteDoc(doc(db,"profiles",docId));
loadApprovedProfiles();

};
/* VIEW PROFILE */

window.viewProfile = function(docId){

window.open("profile.html?id=" + docId, "_blank");

};
window.editProfile = function(docId, type){
  window.location.href = "edit-profile.html?id=" + docId + "&type=" + type;
};

/* LOGOUT */

document.getElementById("logoutBtn").addEventListener("click",async()=>{

await signOut(auth);
window.location.href="login.html";

});

</script>

</body>
</html>
