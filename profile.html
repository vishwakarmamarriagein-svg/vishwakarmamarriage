<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
projectId: "vishwakarmamarriage-e8e13",
storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId: "287592386640",
appId: "1:287592386640:web:93a60b14daf415eac3c155"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const container = document.getElementById("profileContainer");
const logoutBtn = document.getElementById("logoutBtn");

const urlParams = new URLSearchParams(window.location.search);
const profileId = urlParams.get("id");

onAuthStateChanged(auth, async (user) => {

if (!user) {

container.innerHTML = `

<h2 style="text-align:center;">Login Required</h2>

<p style="text-align:center;">
You must login to view full profile
</p>

<div style="text-align:center;margin-top:20px;">
<a href="login.html">
<button style="padding:10px 20px;background:maroon;color:white;border:none;border-radius:5px;">
Login Now
</button>
</a>
</div>

`;

return;

}

logoutBtn.style.display = "block";

try {

const docRef = doc(db, "profiles", profileId);
const docSnap = await getDoc(docRef);

if (!docSnap.exists()) {
container.innerHTML = "<h2>Profile Not Found</h2>";
return;
}

const profile = docSnap.data();

container.innerHTML = `

<img src="${profile.photo}" style="width:100%;max-height:400px;object-fit:cover;border-radius:10px;">

<h2>${profile.name}</h2>

<p><strong>Age:</strong> ${profile.age}</p>
<p><strong>Height:</strong> ${profile.height}</p>
<p><strong>Weight:</strong> ${profile.weight} kg</p>

<p><strong>Manglik:</strong> ${profile.manglik}</p>

<p><strong>Qualification:</strong> ${profile.qualification}</p>
<p><strong>Job:</strong> ${profile.job}</p>

${profile.job === "Working" ? `
<p><strong>Occupation:</strong> ${profile.occupation}</p>
<p><strong>Salary:</strong> ₹${profile.salary}</p>
` : ""}

<p><strong>Father:</strong> ${profile.father}</p>
<p><strong>Mother:</strong> ${profile.mother}</p>

<p><strong>Category:</strong> ${profile.category}</p>

<p><strong>Location:</strong> ${profile.city}, ${profile.district}, ${profile.state}</p>

<p><strong>Contact:</strong> ${profile.contact || "Contact via Admin"}</p>

`;

} catch (error) {

container.innerHTML = "<h2>Error loading profile</h2>";

}

});

logoutBtn.addEventListener("click", async () => {
await signOut(auth);
window.location.href = "login.html";
});

</script>
