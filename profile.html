<!DOCTYPE html>

<html>
<head>

<title>Profile Details</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<button id="logoutBtn" style="
position:absolute;
top:20px;
right:20px;
padding:8px 14px;
background:#444;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
display:none;
">
Logout </button>

<div class="page-container">

<h2>Profile Details</h2>

<div id="profile-container">Loading...</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain:"vishwakarmamarriage-e8e13.firebaseapp.com",
projectId:"vishwakarmamarriage-e8e13",
storageBucket:"vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId:"287592386640",
appId:"1:287592386640:web:93a60b14daf415eac3c155"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const container=document.getElementById("profile-container");

const params=new URLSearchParams(window.location.search);
const id=params.get("id");

async function loadProfile(){

const ref=doc(db,"profiles",id);
const snap=await getDoc(ref);

if(!snap.exists()){
container.innerHTML="Profile not found";
return;
}

const p=snap.data();

let contactHTML="";

if(localStorage.getItem("userLoggedIn")==="true"){

contactHTML=`<p><b>Contact:</b> ${p.contact}</p>`;

}else{

contactHTML=`
<p><b>Contact:</b> 🔒 Login required</p>
<a href="login.html"><button>Login to View Contact</button></a>
`;

}

container.innerHTML=`

<img src="${p.photo}" class="profile-photo">

<h3>${p.name}</h3>

<p>Age: ${p.age}</p>
<p>Height: ${p.height}</p>
<p>Qualification: ${p.qualification}</p>

<p>${p.city}, ${p.district}, ${p.state}</p>

${contactHTML}

`;

}

loadProfile();

</script>

<script>

const logoutBtn=document.getElementById("logoutBtn");

if(localStorage.getItem("userLoggedIn")==="true"){
logoutBtn.style.display="block";
}

logoutBtn.addEventListener("click",function(){

localStorage.removeItem("userLoggedIn");

alert("Logged out successfully");

location.reload();

});

</script>

</body>
</html>
