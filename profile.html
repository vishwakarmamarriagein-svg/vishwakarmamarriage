<!DOCTYPE html>
<html>
<head>

<title>Profile Details</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
background:#f5f5f5;
font-family:Arial;
}

.profile-box{
max-width:600px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

.profile-photo{
width:100%;
max-width:350px;
border-radius:10px;
margin-bottom:15px;
}

</style>

</head>

<body>


<!-- HEADER (same as index.html) -->

<header class="header">

<div class="logo-container">

<img src="icon.png" class="logo-icon">

<span class="logo-text">
Vishwakarma Matrimony
</span>

</div>

<nav class="navbar">

<a href="index.html">Home</a>

<a href="groom.html">Groom</a>

<a href="bride.html">Bride</a>

<a href="submit-profile.html" class="register-free">
Register Your Profile
</a>

<a href="submit-profile.html" class="register-btn">
Register
</a>

<a href="login.html" id="loginLink">Login</a>

<a href="#" id="logoutLink" style="display:none;">Logout</a>

</nav>

</header>



<div class="page-container">

<h2 style="text-align:center;">Profile Details</h2>

<div id="profile-container" class="profile-box">
Loading...
</div>

</div>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain:"vishwakarmamarriage-e8e13.firebaseapp.com",
projectId:"vishwakarmamarriage-e8e13",
storageBucket:"vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId:"287592386640",
appId:"1:287592386640:web:93a60b14daf415eac3c155"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const container=document.getElementById("profile-container");

const params=new URLSearchParams(window.location.search);
const id=params.get("id");


async function loadProfile(){

const ref=doc(db,"profiles",id);
const snap=await getDoc(ref);

if(!snap.exists()){
container.innerHTML="Profile not found";
return;
}

const p=snap.data();

let contactHTML="";

if(localStorage.getItem("userLoggedIn")==="true"){

contactHTML=`<p><b>Contact:</b> ${p.contact}</p>`;

}else{

contactHTML=`
<p><b>Contact:</b> 🔒 Login required</p>
<a href="login.html"><button class="view-btn">Login to View Contact</button></a>
`;

}

container.innerHTML=`

<img src="${p.photo}" class="profile-photo">

<h3>${p.name}</h3>

<p><b>Age:</b> ${p.age}</p>

<p><b>Height:</b> ${p.height}</p>

<p><b>Qualification:</b> ${p.qualification}</p>

<p><b>Location:</b> ${p.city}, ${p.district}, ${p.state}</p>

${contactHTML}

`;

}

loadProfile();

</script>



<script>

const loginLink=document.getElementById("loginLink");
const logoutLink=document.getElementById("logoutLink");

if(localStorage.getItem("userLoggedIn")==="true"){

loginLink.style.display="none";
logoutLink.style.display="inline";

}

logoutLink.addEventListener("click",function(){

localStorage.removeItem("userLoggedIn");

alert("Logged out successfully");

window.location.href="index.html";

});

</script>

</body>
</html>
