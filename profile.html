<!DOCTYPE html>
<html>
<head>

<title>Profile Details</title>

<link rel="stylesheet" href="style.css">

<style>

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
background:#8b0000;
padding:15px 40px;
color:white;
}

.logo{
font-size:20px;
font-weight:bold;
}

.navbar nav a{
color:white;
margin-left:20px;
text-decoration:none;
font-weight:500;
}

.navbar nav a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<header class="navbar">

<div class="logo">
Vishwakarma Matrimony
</div>

<nav>

<a href="index.html">Home</a>
<a href="bride.html">Brides</a>
<a href="groom.html">Grooms</a>
<a href="submit-profile.html">Submit Profile</a>

<a href="login.html" id="loginLink">Login</a>
<a href="#" id="logoutLink" style="display:none;">Logout</a>

</nav>

</header>


<div class="page-container">

<h2>Profile Details</h2>

<div id="profile-container">Loading...</div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain:"vishwakarmamarriage-e8e13.firebaseapp.com",
projectId:"vishwakarmamarriage-e8e13",
storageBucket:"vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId:"287592386640",
appId:"1:287592386640:web:93a60b14daf415eac3c155"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const container=document.getElementById("profile-container");

const params=new URLSearchParams(window.location.search);
const id=params.get("id");

async function loadProfile(){

const ref=doc(db,"profiles",id);
const snap=await getDoc(ref);

if(!snap.exists()){
container.innerHTML="Profile not found";
return;
}

const p=snap.data();

let contactHTML="";

if(localStorage.getItem("userLoggedIn")==="true"){

contactHTML=`<p><b>Contact:</b> ${p.contact}</p>`;

}else{

contactHTML=`
<p><b>Contact:</b> 🔒 Login required</p>
<a href="login.html"><button>Login to View Contact</button></a>
`;

}

container.innerHTML=`

<img src="${p.photo}" class="profile-photo">

<h3>${p.name}</h3>

<p><b>Age:</b> ${p.age}</p>

<p><b>Height:</b> ${p.height}</p>

<p><b>Qualification:</b> ${p.qualification}</p>

<p><b>Location:</b> ${p.city}, ${p.district}, ${p.state}</p>

${contactHTML}

`;

}

loadProfile();

</script>


<script>

const loginLink=document.getElementById("loginLink");
const logoutLink=document.getElementById("logoutLink");

if(localStorage.getItem("userLoggedIn")==="true"){

loginLink.style.display="none";
logoutLink.style.display="inline";

}

logoutLink.addEventListener("click",function(){

localStorage.removeItem("userLoggedIn");

alert("Logged out successfully");

window.location.href="index.html";

});

</script>

</body>
</html>
