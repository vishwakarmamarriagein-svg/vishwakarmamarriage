<!DOCTYPE html>

<html>
<head>

<title>Profile Details - Vishwakarma Matrimony</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
padding:30px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
text-align:center;
}

.profile-photo{
width:100%;
max-height:350px;
object-fit:cover;
border-radius:10px;
margin-bottom:20px;
}

.details{
text-align:left;
line-height:1.8;
font-size:16px;
margin-top:20px;
}

h2{
color:#8b0000;
}

.login-btn{
background:#8b0000;
color:white;
padding:8px 14px;
border:none;
border-radius:5px;
cursor:pointer;
}

.back-btn{
margin-top:25px;
padding:10px 18px;
background:#444;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Profile Details</h2>

<div id="profile">Loading profile...</div>

<button class="back-btn" onclick="history.back()">⬅ Back</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
projectId: "vishwakarmamarriage-e8e13",
storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId: "287592386640",
appId: "1:287592386640:web:93a60b14daf415eac3c155"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container=document.getElementById("profile");

const params=new URLSearchParams(window.location.search);
const id=params.get("id");

let loggedIn=false; // simple login simulation

async function loadProfile(){

if(!id){
container.innerHTML="Profile not found";
return;
}

const ref=doc(db,"pendingProfiles",id);
const snap=await getDoc(ref);

if(!snap.exists()){
container.innerHTML="Profile not found";
return;
}

const p=snap.data();

let contactHTML="";

if(loggedIn){

contactHTML=`<p><b>Contact:</b> ${p.contact || ""}</p>`;

}else{

contactHTML=`
<p><b>Contact:</b> 🔐 Login required</p>
<button class="login-btn" onclick="login()">Login to View</button>
`;

}

container.innerHTML=`

<img src="${p.photo}" class="profile-photo">

<h3>${p.name || ""}</h3>

<div class="details">

<p><b>Age:</b> ${p.age || ""}</p>

<p><b>Height:</b> ${p.height || ""}</p>

<p><b>Weight:</b> ${p.weight || ""}</p>

<p><b>Manglik:</b> ${p.manglik || ""}</p>

<p><b>Marital Status:</b> ${p.maritalStatus || ""}</p>

<p><b>Qualification:</b> ${p.qualification || ""}</p>

<p><b>Job:</b> ${p.job || ""}</p>

<p><b>Occupation:</b> ${p.occupation || ""}</p>

<p><b>Salary:</b> ${p.salary || ""}</p>

<p><b>Father Name:</b> ${p.father || ""}</p>

<p><b>Mother Name:</b> ${p.mother || ""}</p>

<p><b>Category:</b> ${p.category || ""}</p>

<p><b>City:</b> ${p.city || ""}</p>

<p><b>District:</b> ${p.district || ""}</p>

<p><b>State:</b> ${p.state || ""}</p>

${contactHTML}

</div>

`;

}

window.login=function(){

loggedIn=true;
loadProfile();

}

loadProfile();

</script>

</body>
</html>
