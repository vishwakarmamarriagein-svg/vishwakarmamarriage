<!DOCTYPE html>

<html>
<head>

<title>Profile Details - Vishwakarma Matrimony</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
padding:30px;
}

.page-container{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
text-align:center;
}

.profile-photo{
width:220px;
border-radius:10px;
margin-bottom:20px;
}

.profile-info{
text-align:left;
margin-top:20px;
line-height:1.8;
font-size:16px;
}

h2{
color:#8b0000;
}

.back-btn{
margin-top:25px;
padding:10px 18px;
background:#8b0000;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="page-container">

<h2>Profile Details</h2>

<div id="profile-container">
Loading profile...
</div>

<button class="back-btn" onclick="history.back()">⬅ Back</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
projectId: "vishwakarmamarriage-e8e13",
storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId: "287592386640",
appId: "1:287592386640:web:93a60b14daf415eac3c155"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


const container = document.getElementById("profile-container");

const params = new URLSearchParams(window.location.search);
const profileId = params.get("id");


async function loadProfile(){

if(!profileId){
container.innerHTML = "<p>Profile not found.</p>";
return;
}

try{

const docRef = doc(db,"pendingProfiles",profileId);
const docSnap = await getDoc(docRef);

if(!docSnap.exists()){
container.innerHTML = "<p>Profile not found.</p>";
return;
}

const p = docSnap.data();

container.innerHTML = `

<img src="${p.photo || ''}" class="profile-photo">

<h3>${p.name || ''}</h3>

<div class="profile-info">

<p><b>Age:</b> ${p.age || ''}</p>

<p><b>Height:</b> ${p.height || ''}</p>

<p><b>Category:</b> ${p.category || ''}</p>

<p><b>District:</b> ${p.district || ''}</p>

<p><b>State:</b> ${p.state || ''}</p>

<p><b>Qualification:</b> ${p.qualification || ''}</p>

<p><b>Job Status:</b> ${p.job || ''}</p>

<p><b>Father Name:</b> ${p.father || ''}</p>

<p><b>Mother Name:</b> ${p.mother || ''}</p>

<p><b>Contact:</b> ${p.contact || ''}</p>

</div>

`;

}catch(error){

container.innerHTML = "<p>Error loading profile.</p>";
console.error(error);

}

}

loadProfile();

</script>

</body>
</html>
