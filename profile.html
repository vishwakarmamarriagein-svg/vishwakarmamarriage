<!DOCTYPE html>
<html>
<head>

<title>Profile Details</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
background:#f5f5f5;
font-family:Arial;
}

.profile-box{
max-width:600px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

.profile-photo{
width:100%;
max-width:350px;
border-radius:10px;
margin-bottom:15px;
}

.view-btn{
background:maroon;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
margin-top:10px;
}

</style>

</head>

<body>


<!-- HEADER -->

<header class="header">

<div class="logo-container">
<img src="icon.png" class="logo-icon">
<span class="logo-text">Vishwakarma Matrimony</span>
</div>

<nav class="navbar">

<a href="index.html">Home</a>
<a href="groom.html">Groom</a>
<a href="bride.html">Bride</a>

<a href="submit-profile.html" class="register-free">
Register Your Profile
</a>

<a href="submit-profile.html" class="register-btn">
Register
</a>

<a href="login.html" id="loginLink">Login</a>

<a href="#" id="logoutLink" style="display:none;">Logout</a>

</nav>

</header>



<div class="page-container">

<h2 style="text-align:center;">Profile Details</h2>

<div id="profile-container" class="profile-box">
Loading...
</div>

</div>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";


const firebaseConfig={
apiKey:"AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain:"vishwakarmamarriage-e8e13.firebaseapp.com",
projectId:"vishwakarmamarriage-e8e13",
storageBucket:"vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId:"287592386640",
appId:"1:287592386640:web:93a60b14daf415eac3c155"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

const container=document.getElementById("profile-container");

const params=new URLSearchParams(window.location.search);
const id=params.get("id");

let profileData=null;



async function loadProfile(){

const ref=doc(db,"profiles",id);
const snap=await getDoc(ref);

if(!snap.exists()){
container.innerHTML="Profile not found";
return;
}

profileData=snap.data();

showProfile(null);

}



/* SHOW PROFILE */

function showProfile(user){

let contactHTML="";

if(user){

contactHTML=`<p><b>Contact:</b> ${profileData.contact}</p>`;

}else{

contactHTML=`
<p><b>Contact:</b> 🔒 Login required</p>
<a href="login.html"><button class="view-btn">Login to View Contact</button></a>
`;

}

container.innerHTML=`

<img src="${profileData.photo}" class="profile-photo">

<h3>${profileData.name}</h3>

<p><b>Age:</b> ${profileData.age}</p>

<p><b>Height:</b> ${profileData.height}</p>

<p><b>Qualification:</b> ${profileData.qualification}</p>

<p><b>Location:</b> ${profileData.city}, ${profileData.district}, ${profileData.state}</p>

${contactHTML}

`;

}



/* CHECK LOGIN STATE */

onAuthStateChanged(auth,(user)=>{

showProfile(user);

const loginLink=document.getElementById("loginLink");
const logoutLink=document.getElementById("logoutLink");

if(user){
loginLink.style.display="none";
logoutLink.style.display="inline";
}else{
loginLink.style.display="inline";
logoutLink.style.display="none";
}

});


/* LOGOUT */

document.getElementById("logoutLink").addEventListener("click",async()=>{

await signOut(auth);

alert("Logged out successfully");

window.location.href="index.html";

});



loadProfile();

</script>

</body>
</html>
