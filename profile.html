<!DOCTYPE html>
<html>
<head>

<title>Profile Details</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page-container">

<h2>Profile Details</h2>

<div id="profile-container"></div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
projectId: "vishwakarmamarriage-e8e13",
storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId: "287592386640",
appId: "1:287592386640:web:93a60b14daf415eac3c155"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


const params = new URLSearchParams(window.location.search);
const profileId = params.get("id");

const container = document.getElementById("profile-container");


async function loadProfile(){

if(!profileId){

container.innerHTML = "<p>Profile not found.</p>";
return;

}

const docRef = doc(db,"pendingProfiles",profileId);
const docSnap = await getDoc(docRef);

if(!docSnap.exists()){

container.innerHTML = "<p>Profile not found.</p>";
return;

}

const profile = docSnap.data();

container.innerHTML = `

<div class="profile-card">

<img src="${profile.photo}" class="profile-photo">

<h3>${profile.name}</h3>

<p><b>Age:</b> ${profile.age}</p>

<p><b>Category:</b> ${profile.category}</p>

<p><b>Height:</b> ${profile.height}</p>

<p><b>District:</b> ${profile.district}</p>

<p><b>State:</b> ${profile.state}</p>

<p><b>Contact:</b> ${profile.contact}</p>

</div>

`;

}

loadProfile();

</script>

</body>
</html>
