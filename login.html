<!DOCTYPE html>
<html>
<head>

<title>User Login - Vishwakarma Matrimony</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
background:#8b0000;
padding:15px 40px;
color:white;
}

.logo{
font-size:20px;
font-weight:bold;
}

.navbar nav a{
color:white;
margin-left:20px;
text-decoration:none;
font-weight:500;
}

.navbar nav a:hover{
text-decoration:underline;
}

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

.login-container{
display:flex;
justify-content:center;
align-items:center;
height:80vh;
}

.login-box{
background:white;
padding:30px;
border-radius:10px;
width:320px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
text-align:center;
}

.login-box h2{
color:#8b0000;
margin-bottom:20px;
}

.login-box input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

.login-box button{
width:100%;
padding:10px;
background:#8b0000;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

</style>

</head>

<body>
<header class="header">

<div class="logo-container">
<img src="icon.png" class="logo-icon">
<span class="logo-text">Vishwakarma Matrimony</span>
</div>

<nav class="navbar">

<a href="index.html">Home</a>
<a href="groom.html">Grooms</a>
<a href="bride.html">Brides</a>

<a href="submit-profile.html" class="register-btn">Register</a>

<a href="login.html" id="loginLink">Login</a>
<a href="#" id="logoutLink" style="display:none;">Logout</a>

</nav>

</header>
<header class="navbar">

<div class="logo">
Vishwakarma Matrimony
</div>

<nav>

<a href="index.html">Home</a>
<a href="bride.html">Brides</a>
<a href="groom.html">Grooms</a>
<a href="submit-profile.html">Submit Profile</a>

<a href="login.html" id="loginLink">Login</a>
<a href="#" id="logoutLink" style="display:none;">Logout</a>

</nav>

</header>


<div class="login-container">

<div class="login-box">

<h2>User Login</h2>

<input type="email" id="email" placeholder="Enter Email">

<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">Login</button>

</div>

</div>


<script>

function login(){

localStorage.setItem("userLoggedIn","true");

alert("Login Successful");

window.location.href="index.html";

}


const loginLink=document.getElementById("loginLink");
const logoutLink=document.getElementById("logoutLink");

if(localStorage.getItem("userLoggedIn")==="true"){

loginLink.style.display="none";
logoutLink.style.display="inline";

}

logoutLink.addEventListener("click",function(){

localStorage.removeItem("userLoggedIn");

alert("Logged out successfully");

window.location.href="index.html";

});

</script>

</body>
</html>
