<!DOCTYPE html>

<html>
<head>

<title>User Login - Vishwakarma Matrimony</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.login-box{
background:white;
padding:30px;
border-radius:10px;
width:300px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
text-align:center;
}

h2{
color:#8b0000;
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:10px;
background:#8b0000;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="login-box">

<h2>User Login</h2>

<input type="email" id="email" placeholder="Enter Email">

<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">Login</button>

</div>

<script>

function login(){

localStorage.setItem("userLoggedIn","true");

alert("Login Successful");

window.history.back();

}

</script>

</body>
</html>
