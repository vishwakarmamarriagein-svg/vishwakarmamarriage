<!DOCTYPE html>

<html>
<head>

<title>User Login - Vishwakarma Marriage</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

.login-container{
display:flex;
justify-content:center;
align-items:center;
height:80vh;
}

.login-box{
background:white;
padding:30px;
border-radius:10px;
width:320px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
text-align:center;
}

.login-box h2{
color:#8b0000;
margin-bottom:20px;
}

.login-box input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

.login-box button{
width:100%;
padding:10px;
background:#8b0000;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

</style>

</head>

<body>

<header class="header">

<div class="logo-container">

<img src="icon.png" class="logo-icon">

<span class="logo-text">
Vishwakarma Marriage
</span>

</div>

<nav class="navbar">

<a href="index.html">Home</a>

<a href="groom.html">Grooms</a>

<a href="bride.html">Brides</a>

<a href="submit-profile.html" class="register-btn">
Register
</a>

</nav>

</header>

<div class="login-container">

<div class="login-box">

<h2>User Login</h2>

<input type="email" id="email" placeholder="Enter Email">

<input type="password" id="password" placeholder="Enter Password">

<button id="loginBtn">Login</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import { 
getAuth,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";


const firebaseConfig = {
apiKey: "AIzaSyAyT4AF8qZMyvqZNC8hGanMvGSwfydTDJU",
authDomain: "vishwakarmamarriage-e8e13.firebaseapp.com",
projectId: "vishwakarmamarriage-e8e13",
storageBucket: "vishwakarmamarriage-e8e13.firebasestorage.app",
messagingSenderId: "287592386640",
appId: "1:287592386640:web:93a60b14daf415eac3c155"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);



document.getElementById("loginBtn").addEventListener("click", async ()=>{

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

try{

await signInWithEmailAndPassword(auth,email,password);

localStorage.setItem("userLoggedIn","true");

alert("Login Successful");

const params = new URLSearchParams(window.location.search);
const redirect = params.get("redirect");

if(redirect){
window.location.href = decodeURIComponent(redirect);
}else{
window.location.href = "index.html";
}
}catch(error){

alert("Login Failed: "+error.message);

}

});

</script>

</body>
</html>
